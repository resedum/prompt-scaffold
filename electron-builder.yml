# 应用标识
appId: com.promptscaffold.app
productName: Prompt Scaffold

directories:
  output: dist
  buildResources: resources

files:
  - out/**
  - package.json

# 托盘图标等随包资源（mac 模板图也一起带上）
extraResources:
  - from: resources/tray-icon.png
    to: tray-icon.png
  - from: resources/tray-iconTemplate.png
    to: tray-iconTemplate.png
  - from: resources/tray-iconTemplate@2x.png
    to: tray-iconTemplate@2x.png

asar: true
npmRebuild: false          # 零 native 依赖，跳过 rebuild，避免 CI 上误触发 node-gyp
# 注意：不配置 electronDist —— 它会把本机（Windows）Electron 发行目录钉死，毁掉 mac/linux 打包

# ---------- Windows ----------
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.png        # electron-builder 会自动转 .ico
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}

# ---------- macOS ----------
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: resources/icon.png        # electron-builder 在 mac 上会自动转 .icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  artifactName: ${productName}-${version}-${arch}.${ext}

# ---------- Linux ----------
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: resources/icon.png
  category: Utility
  maintainer: prompt-scaffold-team <dev@example.com>
  synopsis: 需求底稿与记忆记事本（本地桌面版）
  description: Prompt Scaffold —— 输入前维度清单澄清、长对话需求守门、记忆记事本（个人版，本地运行，零上传）
  artifactName: ${productName}-${version}-${arch}.${ext}
