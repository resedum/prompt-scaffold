name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/check-platform.mjs
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: windows
          - os: macos-latest
            script: dist:mac
            artifact: macos
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      # 修复：winCodeSign 工具包内含 macOS 符号链接，Windows 解压会被拒绝（权限不足）导致打包失败。
      # 这里预先用 -snl-（符号链接当普通文件）手动解压到 electron-builder 缓存，让后续打包命中缓存、跳过解压。
      - name: Pre-extract winCodeSign (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          CACHE="$LOCALAPPDATA/electron-builder/Cache/winCodeSign/winCodeSign-2.6.0"
          mkdir -p "$CACHE"
          curl -sSL -o /tmp/winCodeSign.7z "https://github.com/electron-userland/electron-builder-binaries/releases/download/winCodeSign-2.6.0/winCodeSign-2.6.0.7z"
          ./node_modules/7zip-bin/win/x64/7za.exe x -snl- -bd -y /tmp/winCodeSign.7z "-o$CACHE"

      - run: npm run ${{ matrix.script }}
        env:
          # mac 无证书：显式跳过签名（个人版不公证）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List release files
        run: find artifacts -type f
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
